        function filterPinyin(text) {
            const lines = text.split('\n');
            const filtered = lines.filter(line => {
                const trimmed = line.trim();
                if (!trimmed) return false;
                const noTone = trimmed.replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǖǘǚǜÜ]/g, 'a');
                const lettersOnly = noTone.replace(/\s+/g, '');
                if (/^[a-zA-Z]+$/.test(lettersOnly) && lettersOnly.length > 1) {
                    return false;
                }
                return true;
            });
            return filtered.join('\n').replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜüĀÁǍÀĒÉĚÈĪÍǏÌŌÓǑÒŪÚǓÙǖǘǚǜÜ]/g, '');
        }

        async function shareToGoogleLens() {
            if (!capturedBlob) return;
            const file = new File([capturedBlob], 'book-cover.jpg', { type: 'image/jpeg' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file] });
                    // After sharing, focus the search input for user to type the title
                    showToast('请在下方输入看到的书名');
                    document.getElementById('previewSearchInput').focus();
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        showToast('分享失败，请手动输入书名');
                    }
                }
            } else {
                showToast('当前浏览器不支持分享，请手动输入书名');
            }
        }

        function retakePhoto() {
            document.getElementById('previewOverlay').style.display = 'none';
            document.getElementById('scanOverlay').style.display = '';
            const img = document.getElementById('previewImage');
            if (img.src) { URL.revokeObjectURL(img.src); img.src = ''; }
            capturedBlob = null;
        }

        async function manualSearch(inputId) {
            const input = document.getElementById(inputId);
            const title = input.value.trim();
            if (!title) { showToast('请输入书名'); return; }
            stopCamera();
            state.isDetecting = false;
            const book = await searchBookByTitle(title);
            if (book) {
                state.currentBook = book;
                showBookResult(book);
            } else {
                showToast('未找到《' + title + '》');
                startScan();
            }
        }

        function formatBookResult(info, fallbackTitle) {
            return {
                title: info.title || fallbackTitle,
                author: (info.authors && info.authors[0]) || '未知作者',
                cover: info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail || '') : '',
                desc: info.description || '',
                isbn: (info.industryIdentifiers && info.industryIdentifiers[0]) ? info.industryIdentifiers[0].identifier : '',
                pages: info.pageCount || 12,
                publisher: info.publisher || ''
            };
        }

        async function searchBookByISBN(isbn) {
            try {
                const resp = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + encodeURIComponent(isbn));
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.items && data.items.length > 0) {
                        const info = data.items[0].volumeInfo;
                        const book = formatBookResult(info, isbn);
                        await storage.saveBook(book);
                        return book;
                    }
                }
            } catch (e) { console.log('ISBN查询失败:', e); }

            try {
                const resp = await fetch('https://openlibrary.org/isbn/' + encodeURIComponent(isbn) + '.json');
                if (resp.ok) {
                    const data = await resp.json();
                    const book = {
                        title: data.title || isbn,
                        author: data.by_statement || '未知作者',
                        cover: data.covers ? 'https://covers.openlibrary.org/b/id/' + data.covers[0] + '-L.jpg' : '',
                        desc: data.notes || '',
                        isbn: isbn,
                        pages: data.number_of_pages || 12,
                        publisher: data.publishers ? data.publishers[0] : ''
                    };
                    await storage.saveBook(book);
                    return book;
                }
            } catch (e) { console.log('Open Library ISBN查询失败:', e); }

            return null;
        }

        async function searchBookByTitleAndAuthor(title, author) {
            let query = 'intitle:' + title;
            if (author) {
                query += '+inauthor:' + author;
            }

            try {
                const resp = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(query) + '&maxResults=5&langRestrict=zh');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.items && data.items.length > 0) {
                        const info = data.items[0].volumeInfo;
                        const book = formatBookResult(info, title);
                        if (book.isbn) await storage.saveBook(book);
                        return book;
                    }
                }
            } catch (e) { console.log('书名+作者查询失败:', e); }

            return null;
        }

        async function searchBookByTitle(title) {
            const byAuthor = await searchBookByTitleAndAuthor(title, '');
            if (byAuthor) return byAuthor;

            try {
                const resp = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent(title) + '&maxResults=1&langRestrict=zh');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.items && data.items.length > 0) {
                        const info = data.items[0].volumeInfo;
                        const book = formatBookResult(info, title);
                        if (book.isbn) await storage.saveBook(book);
                        return book;
                    }
                }
            } catch (e) { console.log('书名查询失败:', e); }

            try {
                const resp = await fetch('https://openlibrary.org/search.json?title=' + encodeURIComponent(title) + '&limit=1');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.docs && data.docs.length > 0) {
                        const doc = data.docs[0];
                        const book = {
                            title: doc.title || title,
                            author: (doc.author_name && doc.author_name[0]) || '未知作者',
                            cover: doc.cover_i ? 'https://covers.openlibrary.org/b/id/' + doc.cover_i + '-L.jpg' : '',
                            desc: doc.first_sentence ? (Array.isArray(doc.first_sentence) ? doc.first_sentence[0] : doc.first_sentence) : '',
                            isbn: (doc.isbn && doc.isbn[0]) || '',
                            pages: doc.number_of_pages || 12
                        };
                        if (book.isbn) await storage.saveBook(book);
                        return book;
                    }
                }
            } catch (e) { console.log('Open Library 书名查询失败:', e); }

            return null;
        }

        // ===== Book Result Screen =====
        function showBookResult(book) {
            document.getElementById('resultTitle').textContent = book.title;
            document.getElementById('resultAuthor').textContent = book.author;
            document.getElementById('resultDesc').textContent = book.desc || '暂无简介';
            const cover = document.getElementById('resultCover');
            if (book.cover) {
                cover.src = book.cover;
                cover.style.display = 'block';
            } else {
                cover.style.display = 'none';
            }
            showScreen('result');
        }

        function rescan() {
            stopTTS();
            startScan();
        }

        async function loadPageContent(pageNum) {
          const book = state.currentBook;
          if (!book) return;

          let pageContent = null;
          
          if (book.id && book.id.startsWith('ocr_')) {
            pageContent = await storage.getPageContent(book.id, pageNum);
          }

          const body = document.getElementById('readingBody');
          
          if (pageContent && pageContent.text) {
            const lines = pageContent.text.split(/[,，。！？\n]+/).filter(l => l.trim());
            body.innerHTML = lines.map(l => '<div class="line">' + l.trim() + '</div>').join('');
          } else if (book.pages && book.pages[pageNum - 1]) {
            const page = book.pages[pageNum - 1];
            const lines = page.text.split(/[,，。！？\n]+/).filter(l => l.trim());
            body.innerHTML = lines.map(l => '<div class="line">' + l.trim() + '</div>').join('');
          } else {
            body.innerHTML = '<div class="line">暂无内容</div>';
          }

          document.getElementById('pageInfo').textContent = '第 ' + pageNum + ' 页 / 共 ' + state.totalPages + ' 页';
        }

        // ===== Start Reading (TTS讲解) =====
        async function startReading() {
          const book = state.currentBook;
          if (!book) return;

          state.currentPage = book.readProgress || 1;
          state.totalPages = book.totalPages || 1;
          state.isPlaying = true;
          state.progress = 0;
          state.isPageComplete = false;

          document.getElementById('readBookTitle').textContent = book.title;
          document.getElementById('playerProgress').style.width = '0%';
          document.getElementById('currentTime').textContent = '0:00';
          document.getElementById('totalTime').textContent = '0:00';
          document.getElementById('turnPagePrompt').style.display = 'none';
          showScreen('reading');
          document.getElementById('tabBarWrap').style.display = 'none';
          updatePlayIcon();

          await loadPageContent(state.currentPage);

          const cachedAudio1 = await storage.getAudio(book.id, 'intro');
          await speak('小朋友你好！今天我们来读《' + book.title + '》。', {
            style: '用温柔亲切的语气，像妈妈给孩子讲故事，声音温暖有爱',
            saveCache: true,
            bookId: book.id,
            pageNum: 'intro',
            cachedAudio: cachedAudio1 ? cachedAudio1.audio : null
          });

          if (state.isPlaying) {
            await speakCurrentPage();
          }

          if (state.currentPage >= state.totalPages && state.currentBook) {
            if (!state.summaryPromise) {
              state.summaryPromise = generateSummary(state.currentBook.id);
            }

            await speak('恭喜你读完啦！真棒！', {
              style: '用开心表扬的语气，像在夸奖孩子，充满鼓励和赞许'
            });
            showToast('恭喜读完《' + state.currentBook.title + '》!');
            state.booksRead++;

            try {
              const summary = await state.summaryPromise;
              if (summary && state.isPlaying) {
                state.summaryText = summary;
                await speak('我来帮你总结一下这个故事：' + summary, {
                  style: '用温柔亲切的语气，像在给孩子讲故事总结'
                });
              }
            } catch (err) {
              console.log('[Summary] 朗读总结失败:', err);
            }

            state.summaryPromise = null;
            state.summaryText = null;
          }

          if (state.isPlaying) {
            showTurnPagePrompt();
          }
        }

        async function speakCurrentPage() {
          const book = state.currentBook;
          if (!book) return;

          const text = document.getElementById('readingBody').innerText;
          if (!text || text.trim().length === 0) return;

          const dualResult = ocrManager.detectDualPage(text);

          if (dualResult && dualResult.isDual) {
            console.log('[TTS] 检测到双页，分段朗读');
            startProgressTimer();

            if (dualResult.leftText) {
              await speak(dualResult.leftText, {
                rate: 0.85,
                saveCache: true,
                bookId: book.id,
                pageNum: state.currentPage + '_left',
              });
            }

            await new Promise(r => setTimeout(r, 2000));
            if (!state.isPlaying) return;

            await speak('小朋友，该看右边了', {
              style: '用活泼上扬的语调，像在提醒孩子，声音明亮有活力'
            });

            await new Promise(r => setTimeout(r, 1000));
            if (!state.isPlaying) return;

            if (dualResult.rightText) {
              await speak(dualResult.rightText, {
                rate: 0.85,
                saveCache: true,
                bookId: book.id,
                pageNum: state.currentPage + '_right',
              });
            }

            stopProgressTimer();
            state.progress = 100;
            updatePlayerUI();
          } else {
            const cachedAudioPage = await storage.getAudio(book.id, state.currentPage);
            startProgressTimer();
            await speak(text, {
              rate: 0.85,
              saveCache: true,
              bookId: book.id,
              pageNum: state.currentPage,
              cachedAudio: cachedAudioPage ? cachedAudioPage.audio : null
            });
            stopProgressTimer();
            state.progress = 100;
            updatePlayerUI();
          }
        }

        let progressTimer = null;
        let progressStartTime = 0;
        const PAGE_ESTIMATE_MS = 15000;

        function startProgressTimer() {
          stopProgressTimer();
          state.progress = 0;
          progressStartTime = Date.now();
          progressTimer = setInterval(() => {
            if (!state.isPlaying) return;
            const elapsed = Date.now() - progressStartTime;
            state.progress = Math.min(95, Math.floor((elapsed / PAGE_ESTIMATE_MS) * 100));
            updatePlayerUI();
          }, 300);
        }

        function stopProgressTimer() {
          if (progressTimer) {
            clearInterval(progressTimer);
            progressTimer = null;
          }
        }

        function closeReading() {
            stopTTS();
            stopReading();
            state.currentBook = null;
            state.storytellingMode = false;
            state.storyContext = null;
            state.summaryPromise = null;
            state.summaryText = null;
            switchTab('home');
        }

        function stopReading() {
            state.isPlaying = false;
            stopTTS();
            stopProgressTimer();
        }

        // ===== Player Controls =====
        function togglePlay() {
            if (state.isPlaying) {
                stopTTS();
                stopProgressTimer();
                state.isPlaying = false;
            } else {
                state.isPlaying = true;
                resumeReading();
            }
            updatePlayIcon();
        }

        async function resumeReading() {
          if (state.isPageComplete) {
            showTurnPagePrompt();
            return;
          }
          await speakCurrentPage();
          if (state.isPlaying) {
            showTurnPagePrompt();
          }
        }

        function updatePlayIcon() {
            const icon = document.getElementById('playIcon');
            if (state.isPlaying) {
                icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            } else {
                icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
            }
        }

        function updatePlayerUI() {
            document.getElementById('playerProgress').style.width = state.progress + '%';
        }

        function formatTime(s) {
            return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        }

        function showTurnPagePrompt() {
            state.isPageComplete = true;
            state.progress = 100;
            updatePlayerUI();
            document.getElementById('turnPagePrompt').style.display = 'flex';
            speak('小朋友翻页啦~', {
                style: '用活泼上扬的语调，像在鼓励孩子，声音明亮有活力'
            });
        }

        function nextPage() {
            if (state.currentPage >= state.totalPages) {
                speak('这本书已经读完啦！真棒！', { pitch: 1.3 });
                showToast('这本书已经读完啦!');
                return;
            }
            if (!state.isPageComplete) {
                showToast('还没讲完呢，请等待...');
                return;
            }
            turnPage(1);
        }

        function prevPage() {
            if (state.currentPage <= 1) {
                showToast('已经是第一页了');
                return;
            }
            turnPage(-1);
        }

        function turnPage(dir) {
          state.currentPage += dir;
          state.isPageComplete = false;
          state.progress = 0;
          document.getElementById('turnPagePrompt').style.display = 'none';
          document.getElementById('playerProgress').style.width = '0%';

          const body = document.getElementById('readingBody');
          body.style.opacity = '0';
          body.style.transform = dir > 0 ? 'translateX(20px)' : 'translateX(-20px)';

          setTimeout(async () => {
            await loadPageContent(state.currentPage);

            body.style.transition = 'opacity 0.3s, transform 0.3s';
            body.style.opacity = '1';
            body.style.transform = 'translateX(0)';

            if (state.isPlaying) {
              await speakCurrentPage();
            }

            if (state.currentPage >= state.totalPages && state.currentBook) {
              if (!state.summaryPromise) {
                state.summaryPromise = generateSummary(state.currentBook.id);
              }

              await speak('恭喜你读完啦！真棒！', {
                style: '用开心表扬的语气，像在夸奖孩子，充满鼓励和赞许'
              });
              showToast('恭喜读完《' + state.currentBook.title + '》!');
              state.booksRead++;

              try {
                const summary = await state.summaryPromise;
                if (summary && state.isPlaying) {
                  state.summaryText = summary;
                  await speak('我来帮你总结一下这个故事：' + summary, {
                    style: '用温柔亲切的语气，像在给孩子讲故事总结'
                  });
                }
              } catch (err) {
                console.log('[Summary] 朗读总结失败:', err);
              }

              state.summaryPromise = null;
              state.summaryText = null;
            }

            if (state.isPlaying) {
              showTurnPagePrompt();
            }
          }, 300);
        }

        let currentFilter = 'all';

        const coverColors = [
          { bg: 'var(--mint-light)', fg: 'var(--mint)' },
          { bg: 'var(--lavender-light)', fg: 'var(--lavender)' },
          { bg: 'var(--pink-light)', fg: 'var(--pink)' },
          { bg: 'var(--peach-light)', fg: 'var(--peach)' },
          { bg: 'var(--gold-light)', fg: 'var(--gold)' }
        ];

        async function loadBookshelf() {
          const books = await storage.getAllBooks();
          const container = document.getElementById('bookshelfContent');
          const countEl = document.querySelector('#bookCount span');

          if (!container) return;

          if (countEl) countEl.textContent = books.length + ' 本';

          const filtered = filterBookList(books, currentFilter);

          if (filtered.length === 0) {
            container.innerHTML = '<div class="library-empty"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><p>还没有图书</p><p class="sub">扫描书本开始阅读吧！</p><button class="scan-link" onclick="startScan()">去扫描 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button></div>';
            return;
          }

          const booksHtml = filtered.map((book, i) => {
            const color = coverColors[i % coverColors.length];
            const progress = book.totalPages > 0 ? Math.round(((book.readProgress || 0) / book.totalPages) * 100) : 0;
            const timeStr = formatReadTime(book.lastReadAt);
            const title = book.title ? book.title.substring(0, 20) : '未命名';
            const author = book.author || '';
            const coverHtml = book.cover
              ? '<img src="' + book.cover + '" alt="' + title + '">'
              : '<div class="cover-placeholder" style="background:' + color.bg + '"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + color.fg + '" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>';
            const badgeHtml = progress >= 100
              ? '<span class="card-badge cached">已完成</span>'
              : (progress > 0 ? '<span class="card-badge cached">' + progress + '%</span>' : '<span class="card-badge new">新书</span>');

            return '<div class="library-card" data-book-id="' + book.id + '" onclick="openCachedBook(\'' + book.id + '\')">'
              + '<button class="delete-btn" onclick="event.stopPropagation();deleteCachedBook(\'' + book.id + '\')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
              + '<div class="card-cover">' + coverHtml + '</div>'
              + '<div class="card-info">'
              + '<div class="card-title">' + title + '</div>'
              + (author ? '<div class="card-author">' + author + '</div>' : '<div class="card-author">' + timeStr + '</div>')
              + '<div class="card-footer"><div class="card-progress"><div class="fill" style="width:' + progress + '%"></div></div>' + badgeHtml + '</div>'
              + '</div></div>';
          }).join('');

          container.innerHTML = '<div class="library-grid">' + booksHtml + '</div>';
        }

        function filterBookList(books, filter) {
          if (filter === 'cached') {
            return books.filter(b => b.isDownloaded || b.isDownloading === false);
          }
          if (filter === 'recent') {
            return [...books].sort((a, b) => (b.lastReadAt || 0) - (a.lastReadAt || 0));
          }
          return [...books].sort((a, b) => (b.lastReadAt || 0) - (a.lastReadAt || 0));
        }

        function filterBooks(filter) {
          currentFilter = filter;
          document.querySelectorAll('.shelf-tab').forEach(t => t.classList.remove('active'));
          const target = document.querySelector('.shelf-tab[data-filter="' + filter + '"]');
          if (target) target.classList.add('active');
          loadBookshelf();
        }

        function formatReadTime(ts) {
          if (!ts) return '未知时间';
          const d = new Date(ts);
          const now = new Date();
          const diff = now - d;
          if (diff < 60000) return '刚刚';
          if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
          if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
          if (diff < 604800000) return Math.floor(diff / 86400000) + '天前';
          return d.toLocaleDateString();
        }

        async function deleteCachedBook(bookId) {
          if (!confirm('确定要删除这本书吗？')) return;
          try {
            await storage.deleteBook(bookId);
            showToast('已删除');
            loadBookshelf();
          } catch (e) {
            showToast('删除失败');
          }
        }

        async function openCachedBook(bookId) {
          const book = await storage.getBook(bookId);
          if (book) {
            state.currentBook = book;
            showBookResult(book);
          } else {
            showToast('书籍未找到');
          }
        }

        // ===== Screen Navigation =====
        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');
            state.screen = name;
        }

        function switchTab(name) {
            if (state.screen === 'reading' || state.screen === 'scan') {
                stopReading();
            }
            if (state.screen === 'scan') {
                stopCamera();
                state.isDetecting = false;
            }
            showScreen(name);
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector('.tab[data-screen="' + name + '"]').classList.add('active');
            document.getElementById('tabBarWrap').style.display = '';
            if (name === 'bookshelf') {
              loadBookshelf();
            }
            if (name === 'home') {
              loadRecentBooks();
            }
            if (name === 'profile') {
              loadProfileStats();
            }
        }

        // ===== Toast =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ===== Keyboard Shortcuts =====
        document.addEventListener('keydown', e => {
            if (e.key === ' ') { e.preventDefault(); if (state.screen === 'reading') togglePlay(); }
            if (e.key === 'ArrowRight' || e.key === 'n') { if (state.screen === 'reading') nextPage(); }
            if (e.key === 'ArrowLeft' || e.key === 'p') { if (state.screen === 'reading') prevPage(); }
            if (e.key === 'r') startScan();
        });

        document.addEventListener('ocr-progress', (e) => {
            const { progress, status } = e.detail;
            document.getElementById('ocrProgressFill').style.width = progress + '%';
            document.getElementById('ocrStatus').textContent = status || '识别中 ' + progress + '%';
        });

        // ===== Event Bindings =====
        function bindClick(id, fn) {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('click', fn);
                el.addEventListener('touchend', function(e) { e.preventDefault(); fn.call(this, e); });
            }
        }

        bindClick('scanBtn', startScan);
        bindClick('cancelScanBtn', cancelScan);
        bindClick('backFromScanBtn', cancelScan);
        bindClick('captureBtn', captureCover);
        bindClick('closeReadingBtn', closeReading);
        bindClick('playBtn', togglePlay);
        bindClick('prevPageBtn', prevPage);
        bindClick('nextPageBtn', nextPage);
        bindClick('startReadBtn', startReading);
        bindClick('rescanBtn', rescan);
        bindClick('backToScanBtn', rescan);

        // Book cards - dynamically loaded

        // Tab bar
        document.querySelectorAll('.tab[data-screen]').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.screen));
            tab.addEventListener('touchend', function(e) {
                e.preventDefault();
                switchTab(this.dataset.screen);
            });
        });

        // Auto read toggle
        const autoToggle = document.getElementById('autoReadToggle');
        if (autoToggle) {
            autoToggle.addEventListener('click', () => autoToggle.classList.toggle('on'));
            autoToggle.addEventListener('touchend', function(e) { e.preventDefault(); this.classList.toggle('on'); });
        }

        // ===== Load Recent Books on Home Screen =====
        async function loadRecentBooks() {
          try {
            const books = await storage.getAllBooks();
            const container = document.getElementById('recentBooks');
            if (!container) return;

            const recent = [...books].sort((a, b) => (b.lastReadAt || 0) - (a.lastReadAt || 0)).slice(0, 3);

            if (recent.length === 0) {
              container.innerHTML = '<div class="book-card" onclick="startScan()"><div class="cover" style="background:var(--peach-light)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--peach)" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg></div><span class="name">扫描新书</span><span class="meta" style="color:var(--peach)">点击开始</span></div>';
              return;
            }

            const colors = ['var(--mint-light)', 'var(--lavender-light)', 'var(--pink-light)'];
            const fgColors = ['var(--mint)', 'var(--lavender)', 'var(--pink)'];
            container.innerHTML = recent.map((book, i) => {
              const progress = book.totalPages > 0 ? Math.round(((book.readProgress || 0) / book.totalPages) * 100) : 0;
              const metaText = progress > 0 ? '已读 ' + progress + '%' : '新书';
              return '<div class="book-card" onclick="openCachedBook(\'' + book.id + '\')">'
                + '<div class="cover" style="background:' + colors[i] + '"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + fgColors[i] + '" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>'
                + '<span class="name">' + (book.title || '未命名').substring(0, 10) + '</span>'
                + '<span class="meta">' + metaText + '</span></div>';
            }).join('');
          } catch (e) {
            console.log('loadRecentBooks error:', e);
          }
        }

        loadRecentBooks();

        // ===== 初始化音色设置 =====
        document.getElementById('currentVoiceName').textContent = voiceSettings.currentVoice;
        document.querySelectorAll('.speed-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.speed === voiceSettings.readSpeed);
        });

        // ===== Load Profile Stats =====
        async function loadProfileStats() {
          try {
            const books = await storage.getAllBooks();
            const statBooks = document.getElementById('statBooks');
            const statPages = document.getElementById('statPages');
            const statDays = document.getElementById('statDays');
            const profileSummary = document.getElementById('profileSummary');

            if (!statBooks) return;

            const totalBooks = books.length;
            let totalPages = 0;
            const readDays = new Set();

            books.forEach(b => {
              totalPages += (b.readProgress || 0);
              if (b.lastReadAt) {
                readDays.add(new Date(b.lastReadAt).toDateString());
              }
              if (b.createdAt) {
                readDays.add(new Date(b.createdAt).toDateString());
              }
            });

            statBooks.textContent = totalBooks;
            statPages.textContent = totalPages;
            statDays.textContent = readDays.size;

            if (totalBooks > 0) {
              profileSummary.textContent = '已读 ' + totalBooks + ' 本书 · ' + totalPages + ' 页';
            } else {
              profileSummary.textContent = '还没有阅读记录';
            }
          } catch (e) {
            console.log('loadProfileStats error:', e);
          }
        }

        // ===== Android Back Gesture =====
        function handleBackGesture() {
            if (state.screen === 'scan') {
                cancelScan();
                return true;
            }
            if (state.screen === 'reading') {
                closeReading();
                return true;
            }
            if (state.screen === 'result') {
                rescan();
                return true;
            }
            return false;
        }

        window.addEventListener('popstate', function(e) {
            if (handleBackGesture()) {
                history.pushState(null, '', location.href);
            }
        });

        history.pushState(null, '', location.href);

        // ===== Service Worker =====
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
