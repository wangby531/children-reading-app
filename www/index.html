<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FFB088">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@andresaya/edge-tts@1.8.0/dist/browser/edge-tts.umd.min.js"></script>
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>读书宝 - 儿童智能读书</title>
    <style>
        /* ===== Design Tokens (from Pencil) ===== */
        :root {
            --bg-cream: #FFF8F0;
            --bg-white: #FFFFFF;
            --bg-card: #FFF5EE;
            --peach: #FFB088;
            --peach-light: #FFE0CC;
            --mint: #A8D8C8;
            --mint-light: #D4F0E8;
            --lavender: #C8B8E8;
            --lavender-light: #E8E0F8;
            --gold: #FFD93D;
            --gold-light: #FFF3B0;
            --pink: #FFB5B5;
            --pink-light: #FFE0E0;
            --text-primary: #4A3728;
            --text-secondary: #8B7B6B;
            --text-muted: #B8A898;
            --text-white: #FFFFFF;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg-cream);
            color: var(--text-primary);
            overflow: hidden;
            height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* ===== Screen Management ===== */
        .screen { display: none; flex-direction: column; width: 100%; height: 100dvh; position: absolute; top: 0; left: 0; padding-top: env(safe-area-inset-top, 0); }
        .screen.active { display: flex; }

        /* ===== Tab Bar ===== */
        .tab-bar-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 21px 21px;
            z-index: 100;
        }
        .tab-bar {
            height: 62px;
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            display: flex;
            padding: 4px;
            gap: 4px;
            border: 1px solid #F0E8E0;
        }
        .tab {
            flex: 1;
            border-radius: 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.25s;
        }
        .tab svg { width: 20px; height: 20px; }
        .tab .label { font-size: 10px; font-weight: 600; }
        .tab.active { background: var(--peach); }
        .tab.active svg, .tab.active .label { color: var(--text-white); }
        .tab:not(.active) svg, .tab:not(.active) .label { color: var(--text-muted); }

        /* ===== HOME SCREEN ===== */
        #screen-home { background: var(--bg-cream); }
        #screen-home .content {
            flex: 1;
            padding: 16px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .greeting {
            text-align: center;
            padding: 12px 0 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .greeting svg { width: 48px; height: 48px; color: var(--gold); }
        .greeting h1 { font-size: 28px; font-weight: 700; }
        .greeting p { font-size: 16px; color: var(--text-secondary); }

        .scan-btn {
            width: 100%;
            height: 200px;
            background: var(--peach);
            border-radius: var(--radius-xl);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border: none;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .scan-btn:active { transform: scale(0.97); }
        .scan-btn svg { width: 64px; height: 64px; color: var(--text-white); }
        .scan-btn .title { font-size: 26px; font-weight: 700; color: var(--text-white); }
        .scan-btn .sub { font-size: 14px; color: rgba(255,255,255,0.8); }

        .section-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0 8px;
        }
        .section-label h2 { font-size: 20px; font-weight: 700; }
        .section-label .link { font-size: 14px; color: var(--lavender); display: flex; align-items: center; gap: 4px; }

        .book-cards { display: flex; gap: 12px; padding-bottom: 100px; }
        .book-card {
            flex: 1;
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }
        .book-card .cover {
            height: 80px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .book-card .cover svg { width: 36px; height: 36px; }
        .book-card .name { font-size: 13px; font-weight: 600; }
        .book-card .meta { font-size: 11px; color: var(--text-muted); }

        /* ===== SCANNING SCREEN ===== */
        #screen-scan { background: #000; }
        #screen-scan .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #cameraVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px 32px;
            pointer-events: none;
            z-index: 1;
        }
        .scan-top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            pointer-events: auto;
            padding-top: env(safe-area-inset-top, 0);
        }
        .scan-info {
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .scan-title { font-size: 24px; font-weight: 700; }
        .scan-sub { font-size: 15px; margin-top: 6px; opacity: 0.9; }

        .progress-track {
            width: 100%;
            height: 8px;
            background: var(--peach-light);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--peach);
            border-radius: 4px;
            width: 0%;
            animation: fill-bar 3s ease-in-out forwards;
        }
        @keyframes fill-bar { from { width: 0%; } to { width: 100%; } }

        .ocr-progress {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background: rgba(0,0,0,0.8);
          padding: 30px;
          border-radius: 20px;
          text-align: center;
          z-index: 10;
          width: 80%;
        }
        .ocr-progress-text {
          color: white;
          font-size: 18px;
          font-weight: 600;
          margin-bottom: 16px;
        }
        .ocr-status {
          color: rgba(255,255,255,0.8);
          font-size: 14px;
          margin-top: 12px;
        }

        .tip-box {
            width: 100%;
            background: var(--gold-light);
            border-radius: var(--radius-lg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .tip-box svg { width: 28px; height: 28px; color: var(--gold); }
        .tip-box p { font-size: 14px; text-align: center; }

        .cancel-btn {
            width: 100%;
            height: 56px;
            background: rgba(255,255,255,0.9);
            border-radius: 28px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
            pointer-events: auto;
        }
        .cancel-btn svg { width: 22px; height: 22px; }
        .capture-ring {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px 0;
        }
        .capture-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: white;
            border: 4px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }
        .capture-btn:active { transform: scale(0.9); }
        }
        .scan-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            pointer-events: auto;
        }
        .scan-action-btn {
            width: 100%;
            height: 56px;
            background: var(--peach);
            border-radius: 28px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-white);
            cursor: pointer;
        }
        .scan-action-btn svg { width: 22px; height: 22px; }
        .scan-action-btn.secondary {
            background: rgba(255,255,255,0.9);
            color: var(--text-primary);
        }
        .preview-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            z-index: 2;
        }
        .preview-img {
            flex: 1;
            object-fit: contain;
            width: 100%;
        }
        .scan-bottom {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
            pointer-events: auto;
        }
        .manual-search {
            display: flex;
            gap: 8px;
        }
        .search-input {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 24px;
            padding: 0 20px;
            font-size: 16px;
            background: rgba(255,255,255,0.95);
            color: var(--text-primary);
            outline: none;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-btn {
            height: 48px;
            padding: 0 20px;
            border: none;
            border-radius: 24px;
            background: var(--mint);
            color: var(--text-white);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        /* ===== RESULT SCREEN ===== */
        #screen-result { background: var(--bg-cream); }
        .result-content { flex: 1; display: flex; flex-direction: column; }
        .result-header {
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
        }
        .result-body {
            flex: 1;
            padding: 16px 24px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            overflow-y: auto;
        }
        .result-cover {
            width: 160px;
            height: 220px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            background: var(--peach-light);
        }
        .result-title { font-size: 24px; font-weight: 700; text-align: center; }
        .result-author { font-size: 15px; color: var(--text-secondary); }
        .result-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
            text-align: left;
            width: 100%;
            max-height: 120px;
            overflow-y: auto;
        }
        .result-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 8px;
        }
        .action-btn {
            flex: 1;
            height: 52px;
            border-radius: 26px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .action-btn.primary { background: var(--peach); color: var(--text-white); }
        .action-btn.secondary { background: var(--bg-white); color: var(--text-primary); border: 1px solid #F0E8E0; }
        .action-btn svg { width: 20px; height: 20px; }

        /* ===== READING SCREEN ===== */
        #screen-reading { background: var(--bg-white); }
        .reading-header {
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .reading-header .icon-round {
            width: 40px; height: 40px;
            background: var(--bg-card);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: none;
        }
        .reading-header .icon-round svg { width: 22px; height: 22px; color: var(--text-secondary); }
        .reading-header .book-name { font-size: 20px; font-weight: 700; }
        .reading-header .icon-round.bookmark svg { color: var(--peach); }

        .reading-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 32px;
            gap: 16px;
            overflow-y: auto;
        }
        .reading-body .line {
            font-size: 22px;
            font-weight: 500;
            line-height: 2;
            width: 100%;
        }

        .page-indicator {
            text-align: center;
            padding: 8px 0;
            font-size: 14px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .turn-page-prompt {
            display: flex;
            justify-content: center;
            padding: 0 0 8px;
            flex-shrink: 0;
        }
        .turn-page-pill {
            background: var(--gold-light);
            border-radius: 22px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: bounce 1s infinite;
        }
        .turn-page-pill svg { width: 20px; height: 20px; color: var(--gold); }
        .turn-page-pill span { font-size: 15px; font-weight: 600; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .player-bar {
            padding: 12px 24px;
            flex-shrink: 0;
        }
        .player-progress {
            width: 100%;
            height: 6px;
            background: var(--peach-light);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .player-progress .played {
            height: 100%;
            background: var(--peach);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s;
        }
        .player-time {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .player-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .ctrl-btn {
            width: 52px;
            height: 52px;
            background: var(--bg-card);
            border-radius: 26px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ctrl-btn svg { width: 24px; height: 24px; color: var(--text-secondary); }
        .ctrl-btn.play {
            width: 72px;
            height: 72px;
            background: var(--peach);
            border-radius: 36px;
        }
        .ctrl-btn.play svg { width: 32px; height: 32px; color: var(--text-white); }

        /* ===== BOOKSHELF SCREEN ===== */
        #screen-bookshelf { background: var(--bg-cream); }
        #screen-bookshelf .content {
            flex: 1;
            padding: 16px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .shelf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
        }
        .shelf-header h1 { font-size: 28px; font-weight: 700; }
        .shelf-count {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--lavender);
            font-size: 14px;
            font-weight: 600;
        }
        .shelf-count svg { width: 18px; height: 18px; }

        .shelf-tabs {
            display: flex;
            gap: 8px;
            padding-bottom: 16px;
        }
        .shelf-tab {
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--bg-white);
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .shelf-tab.active { background: var(--peach); color: var(--text-white); }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-bottom: 100px;
        }
        .library-card {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .library-card:active { transform: scale(0.97); }
        .library-card .card-cover {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .library-card .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .library-card .card-cover .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .library-card .card-cover .cover-placeholder svg { width: 48px; height: 48px; }
        .library-card .card-info {
            padding: 12px;
        }
        .library-card .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .library-card .card-author {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .library-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .library-card .card-progress {
            flex: 1;
            height: 4px;
            background: #F0E8E0;
            border-radius: 2px;
            overflow: hidden;
            margin-right: 8px;
        }
        .library-card .card-progress .fill {
            height: 100%;
            border-radius: 2px;
            background: var(--mint);
            transition: width 0.3s;
        }
        .library-card .card-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--text-white);
        }
        .library-card .card-badge.cached { background: var(--mint); }
        .library-card .card-badge.new { background: var(--peach); }
        .library-card .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        .library-card .delete-btn svg { width: 16px; height: 16px; color: white; }

        .library-empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .library-empty svg { width: 64px; height: 64px; margin-bottom: 16px; color: var(--peach-light); }
        .library-empty p { font-size: 16px; margin-bottom: 8px; }
        .library-empty .sub { font-size: 14px; color: var(--text-muted); }
        .library-empty .scan-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 16px;
            padding: 10px 20px;
            background: var(--peach);
            color: var(--text-white);
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .badge {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-white);
            width: fit-content;
        }

        /* ===== PROFILE SCREEN ===== */
        #screen-profile { background: var(--bg-cream); }
        #screen-profile .content {
            flex: 1;
            padding: 16px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        #screen-profile .content > h1 { font-size: 28px; font-weight: 700; }

        .profile-card {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .avatar {
            width: 64px;
            height: 64px;
            background: var(--lavender-light);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .avatar svg { width: 32px; height: 32px; color: var(--lavender); }
        .profile-info h2 { font-size: 20px; font-weight: 700; }
        .profile-info p { font-size: 14px; color: var(--text-secondary); }

        .stats-row { display: flex; gap: 12px; }
        .stat-card {
            flex: 1;
            height: 90px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .stat-card .num { font-size: 28px; font-weight: 700; }
        .stat-card .lbl { font-size: 12px; color: var(--text-secondary); }

        .settings-label {
            font-size: 18px;
            font-weight: 700;
            padding-top: 8px;
        }
        .settings-list {
            background: var(--bg-white);
            border-radius: var(--radius-xl);
            overflow: hidden;
        }
        .setting-item {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .setting-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .setting-item .left svg { width: 22px; height: 22px; }
        .setting-item .left span { font-size: 16px; }
        .setting-item .right { font-size: 14px; color: var(--text-muted); }
        .divider { height: 1px; background: #F5F0EA; margin: 0 16px; }

        .toggle {
            width: 52px;
            height: 28px;
            border-radius: 14px;
            padding: 3px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle.on { background: var(--mint); justify-content: flex-end; }
        .toggle .knob {
            width: 22px;
            height: 22px;
            background: var(--bg-white);
            border-radius: 11px;
        }

        /* ===== Speed Selector ===== */
        .speed-selector {
            display: flex;
            gap: 8px;
        }
        .speed-btn {
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid #E0D5CC;
            background: var(--bg-white);
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .speed-btn.active {
            background: var(--peach);
            color: var(--text-white);
            border-color: var(--peach);
        }

        /* ===== Voice Settings Modal ===== */
        .voice-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 500;
            align-items: flex-end;
            justify-content: center;
        }
        .voice-modal.show {
            display: flex;
        }
        .voice-modal-content {
            background: var(--bg-white);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .voice-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .voice-modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }
        .voice-modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #F0E8E0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .voice-section-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .voice-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .voice-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            text-align: center;
        }
        .voice-card:hover {
            border-color: var(--peach-light);
        }
        .voice-card.selected {
            border-color: var(--peach);
            background: var(--peach-light);
        }
        .voice-card .voice-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-white);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .voice-card .voice-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .voice-card .voice-desc {
            font-size: 12px;
            color: var(--text-muted);
        }
        .voice-preview-btn {
            width: 100%;
            padding: 14px;
            background: var(--peach);
            color: var(--text-white);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .voice-preview-btn:disabled {
            background: #E0D5CC;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74, 55, 40, 0.9);
            color: var(--text-white);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }

        /* ===== Transitions ===== */
        .screen { transition: opacity 0.25s; }
    </style>
</head>
<body>
    <div class="app">

        <!-- ========== HOME SCREEN ========== -->
        <div id="screen-home" class="screen active">
            <div class="content">
                <div class="greeting">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <h1>你好，小朋友!</h1>
                    <p>把书放到摄像头下面吧</p>
                </div>
                <button class="scan-btn" type="button" id="scanBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                    <span class="title">开始读书</span>
                    <span class="sub">点击这里开始扫描图书</span>
                </button>
                <div class="section-label">
                    <h2>最近在读</h2>
                    <span class="link" onclick="switchTab('bookshelf')" style="cursor:pointer">查看全部 <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>
                </div>
                <div class="book-cards" id="recentBooks">
                </div>
            </div>
        </div>

        <!-- ========== SCANNING SCREEN ========== -->
        <div id="screen-scan" class="screen">
            <div class="content">
                <video id="cameraVideo" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;"></video>
                <div class="scan-overlay" id="scanOverlay">
                    <div class="scan-top-bar">
                        <button class="icon-round" id="backFromScanBtn" style="background:rgba(0,0,0,0.4);">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                    </div>
                    <div class="scan-bottom" id="scanActions">
                        <div class="capture-ring">
                            <button class="capture-btn" id="captureBtn"></button>
                        </div>
                        <button class="cancel-btn" id="cancelScanBtn">取消</button>
                    </div>
                </div>
                <div class="ocr-progress" id="ocrProgress" style="display:none;">
                  <div class="ocr-progress-text">正在识别文字...</div>
                  <div class="progress-track">
                    <div class="progress-fill" id="ocrProgressFill" style="width:0%"></div>
                  </div>
                  <div class="ocr-status" id="ocrStatus">准备中...</div>
                </div>
            </div>
        </div>

        <!-- ========== BOOK RESULT SCREEN ========== -->
        <div id="screen-result" class="screen">
            <div class="result-content">
                <div class="result-header">
                    <button class="icon-round" id="backToScanBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    </button>
                    <span>识别结果</span>
                    <div style="width:40px"></div>
                </div>
                <div class="result-body">
                    <img id="resultCover" class="result-cover" src="" alt="" onerror="this.style.display='none'">
                    <div id="resultTitle" class="result-title">书名</div>
                    <div id="resultAuthor" class="result-author">作者</div>
                    <div id="resultDesc" class="result-desc">简介</div>
                    <div class="result-actions">
                        <button class="action-btn primary" id="startReadBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            开始讲解
                        </button>
                        <button class="action-btn secondary" id="rescanBtn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                            重新扫描
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== READING SCREEN ========== -->
        <div id="screen-reading" class="screen">
            <div class="reading-header">
                <button class="icon-round" id="closeReadingBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <span class="book-name" id="readBookTitle">读书中</span>
                <button class="icon-round bookmark">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                </button>
            </div>
            <div class="reading-body" id="readingBody">
                <div class="line" style="color:var(--text-muted);text-align:center;padding-top:40px;">正在加载内容...</div>
            </div>
            <div class="page-indicator" id="pageInfo"></div>
            <div class="turn-page-prompt" id="turnPagePrompt" style="display:none">
                <div class="turn-page-pill">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                    <span>小朋友翻页啦~</span>
                </div>
            </div>
            <div class="player-bar">
                <div class="player-progress"><div class="played" id="playerProgress"></div></div>
                <div class="player-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
                <div class="player-controls">
                    <button class="ctrl-btn" id="prevPageBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
                    </button>
                    <button class="ctrl-btn play" id="playBtn">
                        <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <button class="ctrl-btn" id="nextPageBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- ========== BOOKSHELF SCREEN ========== -->
        <div id="screen-bookshelf" class="screen">
          <div class="content">
            <div class="shelf-header">
              <h1>我的图书库</h1>
              <div class="shelf-count" id="bookCount">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
                <span>0 本</span>
              </div>
            </div>
            <div class="shelf-tabs">
              <button class="shelf-tab active" data-filter="all" onclick="filterBooks('all')">全部</button>
              <button class="shelf-tab" data-filter="cached" onclick="filterBooks('cached')">已下载</button>
              <button class="shelf-tab" data-filter="recent" onclick="filterBooks('recent')">最近阅读</button>
            </div>
            <div id="bookshelfContent"></div>
            <div style="height:100px"></div>
          </div>
        </div>

        <!-- ========== PROFILE SCREEN ========== -->
        <div id="screen-profile" class="screen">
            <div class="content">
                <h1>我的</h1>
                <div class="profile-card">
                    <div class="avatar">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                    </div>
                    <div class="profile-info">
                        <h2>小宝贝</h2>
                        <p id="profileSummary">还没有阅读记录</p>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-card" style="background:var(--mint-light)">
                        <span class="num" style="color:var(--mint)" id="statBooks">0</span>
                        <span class="lbl">已读书籍</span>
                    </div>
                    <div class="stat-card" style="background:var(--peach-light)">
                        <span class="num" style="color:var(--peach)" id="statPages">0</span>
                        <span class="lbl">已读页数</span>
                    </div>
                    <div class="stat-card" style="background:var(--gold-light)">
                        <span class="num" style="color:var(--gold)" id="statDays">0</span>
                        <span class="lbl">阅读天数</span>
                    </div>
                </div>
                <div class="settings-label">朗读设置</div>
                <div class="settings-list">
                    <div class="setting-item" onclick="showVoiceSettings()" style="cursor:pointer">
                        <div class="left">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--lavender)" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                            <span>朗读音色</span>
                        </div>
                        <span class="right" id="currentVoiceName">冰糖（默认）</span>
                    </div>
                    <div class="divider"></div>
                    <div class="setting-item">
                        <div class="left">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--peach)" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                            <span>朗读语速</span>
                        </div>
                        <div class="speed-selector">
                            <button class="speed-btn" data-speed="slow" onclick="setReadSpeed('slow')">慢</button>
                            <button class="speed-btn active" data-speed="normal" onclick="setReadSpeed('normal')">正常</button>
                            <button class="speed-btn" data-speed="fast" onclick="setReadSpeed('fast')">快</button>
                        </div>
                    </div>
                </div>
                <div class="settings-label">家长设置</div>
                <div class="settings-list">
                    <div class="setting-item">
                        <div class="left">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--peach)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                            <span>阅读时间限制</span>
                        </div>
                        <span class="right">30 分钟</span>
                    </div>
                    <div class="divider"></div>
                    <div class="setting-item">
                        <div class="left">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <span>护眼模式</span>
                        </div>
                        <div class="toggle on" id="autoReadToggle">
                            <div class="knob"></div>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <div class="setting-item">
                        <div class="left">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <span>家长锁</span>
                        </div>
                        <span class="right" style="color:var(--mint)">已开启</span>
                    </div>
                </div>
                <div style="height:100px"></div>
            </div>
        </div>

        <!-- ========== TAB BAR ========== -->
        <div class="tab-bar-wrap" id="tabBarWrap">
            <div class="tab-bar">
                <div class="tab active" data-screen="home">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="label">首页</span>
                </div>
                <div class="tab" data-screen="bookshelf">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                    <span class="label">书架</span>
                </div>
                <div class="tab" data-screen="profile">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="label">我的</span>
                </div>
            </div>
        </div>

        <!-- ========== VOICE SETTINGS MODAL ========== -->
        <div class="voice-modal" id="voiceModal">
            <div class="voice-modal-content">
                <div class="voice-modal-header">
                    <h3>选择朗读音色</h3>
                    <button class="voice-modal-close" onclick="hideVoiceSettings()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>

                <div class="voice-section-title">预置音色</div>
                <div class="voice-grid" id="voiceGrid">
                    <div class="voice-card selected" data-voice="冰糖" onclick="selectVoice(this)">
                        <div class="voice-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--lavender)" stroke-width="2" width="24" height="24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </div>
                        <div class="voice-name">冰糖</div>
                        <div class="voice-desc">温柔女声</div>
                    </div>
                    <div class="voice-card" data-voice="茉莉" onclick="selectVoice(this)">
                        <div class="voice-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2" width="24" height="24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </div>
                        <div class="voice-name">茉莉</div>
                        <div class="voice-desc">活泼女声</div>
                    </div>
                    <div class="voice-card" data-voice="苏打" onclick="selectVoice(this)">
                        <div class="voice-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="2" width="24" height="24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </div>
                        <div class="voice-name">苏打</div>
                        <div class="voice-desc">沉稳男声</div>
                    </div>
                    <div class="voice-card" data-voice="白桦" onclick="selectVoice(this)">
                        <div class="voice-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="var(--peach)" stroke-width="2" width="24" height="24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                        </div>
                        <div class="voice-name">白桦</div>
                        <div class="voice-desc">磁性男声</div>

class OCRManager {
  constructor() {
    this.worker = null;
    this.initialized = false;
    this.initPromise = null;
    this.qwenApiKey = 'tp-cgdr7i0jzptpkt3vwjqr4fl4uxxndfjlz8dly1o2lx5mnord';
    this.qwenApiUrl = 'https://token-plan-cn.xiaomimimo.com/v1/chat/completions';
    this.qwenModel = 'mimo-v2.5';
  }

  async init() {
    if (this.initialized) return;
    if (this.initPromise) return this.initPromise;

    this.initPromise = (async () => {
      try {
        this.worker = await Tesseract.createWorker('chi_sim+eng', 1, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const progress = Math.round(m.progress * 100);
              document.dispatchEvent(new CustomEvent('ocr-progress', { detail: { progress } }));
            }
          }
        });
        await this.worker.setParameters({
          tessedit_pageseg_mode: '6',
          preserve_interword_spaces: '1'
        });
        this.initialized = true;
      } catch (err) {
        console.error('OCR初始化失败:', err);
        throw err;
      }
    })();

    return this.initPromise;
  }

  async recognizeWithCloud(imageBlob) {
    document.dispatchEvent(new CustomEvent('ocr-progress', { detail: { progress: 10, status: '正在使用AI识别...' } }));
    
    try {
      const base64 = await this.blobToBase64(imageBlob);
      
      const response = await fetch(this.qwenApiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + this.qwenApiKey,
          'api-key': this.qwenApiKey
        },
        body: JSON.stringify({
          model: this.qwenModel,
          messages: [
            {
              role: 'user',
              content: [
                {
                  type: 'image_url',
                  image_url: {
                    url: 'data:image/jpeg;base64,' + base64
                  }
                },
                {
                  type: 'text',
                  text: '识别图中文字，只输出中文内容，忽略拼音、封面信息和页码。如果是双页，请标注左页和右页。'
                }
              ]
            }
          ]
        })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error('AI识别请求失败: ' + (errorData.message || response.status));
      }

      const result = await response.json();
      
      if (result.choices && result.choices.length > 0) {
        const text = result.choices[0].message.content || '';
        return {
          text: text.trim(),
          confidence: 95,
          source: 'ai'
        };
      }

      throw new Error('未识别到文字');
    } catch (err) {
      console.error('AI识别失败:', err);
      throw err;
    }
  }

  detectDualPage(text) {
    if (!text) return null;
    const hasLeft = /左页/.test(text);
    const hasRight = /右页/.test(text);
    if (hasLeft && hasRight) {
      const leftMatch = text.match(/左页[：:\s]*([\s\S]*?)(?=右页|$)/);
      const rightMatch = text.match(/右页[：:\s]*([\s\S]*?)$/);
      return {
        isDual: true,
        leftText: leftMatch ? leftMatch[1].trim() : '',
        rightText: rightMatch ? rightMatch[1].trim() : ''
      };
    }
    if (hasLeft || hasRight) {
      const side = hasLeft ? '左' : '右';
      const regex = new RegExp(side + '页[：:\\s]*([\\s\\S]*?)$');
      const match = text.match(regex);
      return {
        isDual: false,
        side: side,
        text: match ? match[1].trim() : text
      };
    }
    return null;
  }

  async identifyBook(imageBlob) {
    document.dispatchEvent(new CustomEvent('ocr-progress', { detail: { progress: 15, status: '正在识别图书...' } }));
    
    try {
      const base64 = await this.blobToBase64(imageBlob);
      
      const response = await fetch(this.qwenApiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + this.qwenApiKey,
          'api-key': this.qwenApiKey
        },
        body: JSON.stringify({
          model: this.qwenModel,
          messages: [
            {
              role: 'user',
              content: [
                {
                  type: 'image_url',
                  image_url: {
                    url: 'data:image/jpeg;base64,' + base64
                  }
                },
                {
                  type: 'text',
                  text: '这是一本书的封面照片。请识别这本书的信息，按以下JSON格式返回（不要返回其他内容）：\n{"title":"书名","author":"作者","isbn":"ISBN编号(如果没有就填空字符串)","publisher":"出版社(如果能识别到)","description":"简短的书籍简介(一句话)"}\n只返回JSON，不要返回任何其他文字。'
                }
              ]
            }
          ]
        })
      });

      if (!response.ok) {
        throw new Error('AI识别请求失败: ' + response.status);
      }

      const result = await response.json();
      
      if (result.choices && result.choices.length > 0) {
        let text = result.choices[0].message.content.trim();
        text = text.replace(/```json\s*/g, '').replace(/```\s*/g, '');
        
        try {
          const bookInfo = JSON.parse(text);
          return {
            title: bookInfo.title || '',
            author: bookInfo.author || '',
            isbn: bookInfo.isbn || '',
            publisher: bookInfo.publisher || '',
            description: bookInfo.description || '',
            confidence: 95,
            source: 'ai'
          };
        } catch (e) {
          const titleMatch = text.match(/title['":\s]+([^'",\n]+)/);
          return {
            title: titleMatch ? titleMatch[1].trim() : text.substring(0, 30),
            author: '',
            isbn: '',
            publisher: '',
            description: text,
            confidence: 70,
            source: 'ai'
          };
        }
      }

      throw new Error('未识别到图书信息');
    } catch (err) {
      console.error('AI图书识别失败:', err);
      throw err;
    }
  }

  blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  async recognizeWithLocal(imageBlob) {
    if (!this.initialized) {
      await this.init();
    }

    document.dispatchEvent(new CustomEvent('ocr-progress', { detail: { progress: 30, status: '使用本地引擎识别...' } }));

    const processedBlob = await this.preprocessImage(imageBlob);
    const result = await this.worker.recognize(processedBlob);
    
    let text = result.data.text.trim();
    text = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
    text = text.replace(/\s+/g, ' ');
    
    return {
      text: text,
      confidence: result.data.confidence,
      source: 'local'
    };
  }

  async preprocessImage(imageBlob) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(imageBlob);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        let width = img.width;
        let height = img.height;
        const maxSize = 1500;
        if (width > maxSize || height > maxSize) {
          const scale = maxSize / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);
        
        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
        
        for (let i = 0; i < data.length; i += 4) {
          const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          data[i] = gray;
          data[i + 1] = gray;
          data[i + 2] = gray;
        }
        
        let min = 255, max = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i] < min) min = data[i];
          if (data[i] > max) max = data[i];
        }
        const range = max - min || 1;
        const contrast = 1.5;
        for (let i = 0; i < data.length; i += 4) {
          let val = ((data[i] - min) / range) * 255;
          val = Math.round(((val - 128) * contrast) + 128);
          val = Math.max(0, Math.min(255, val));
          data[i] = val;
          data[i + 1] = val;
          data[i + 2] = val;
        }
        
        const threshold = 128;
        for (let i = 0; i < data.length; i += 4) {
          const val = data[i] > threshold ? 255 : 0;
          data[i] = val;
          data[i + 1] = val;
          data[i + 2] = val;
        }
        
        ctx.putImageData(imageData, 0, 0);
        
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(url);
          resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.src = url;
    });
  }

  async recognizePage(imageBlob) {
    try {
      document.dispatchEvent(new CustomEvent('ocr-progress', { detail: { progress: 5, status: '尝试云端识别...' } }));
      const cloudResult = await this.recognizeWithCloud(imageBlob);
      if (cloudResult.text && cloudResult.text.length > 5) {

    } catch (err) {
      console.log('云端识别失败，切换到本地引擎:', err.message);

    try {
      document.dispatchEvent(new CustomEvent('ocr-progress', { detail: { progress: 40, status: '使用本地引擎...' } }));
      return await this.recognizeWithLocal(imageBlob);
    } catch (err) {
      console.error('本地OCR也失败:', err);
      throw new Error('识别失败，请手动输入书名');
    }
  }

  terminate() {
    if (this.worker) {
      this.worker.terminate();
      this.worker = null;
      this.initialized = false;
    }
  }
}

class StorageManager {
  constructor() {
    this.dbName = 'DushubaoDB';
    this.dbVersion = 3;
    this.db = null;
  }

  async open() {
    if (this.db) return this.db;

    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.dbName, this.dbVersion);

      request.onupgradeneeded = (event) => {
        const db = event.target.result;

        if (!db.objectStoreNames.contains('books')) {
          const bookStore = db.createObjectStore('books', { keyPath: 'id' });
          bookStore.createIndex('title', 'title', { unique: false });
          bookStore.createIndex('lastReadAt', 'lastReadAt', { unique: false });
        }

        if (!db.objectStoreNames.contains('pages')) {
          const pageStore = db.createObjectStore('pages', { keyPath: ['bookId', 'pageNum'] });
          pageStore.createIndex('bookId', 'bookId', { unique: false });
        }

        if (!db.objectStoreNames.contains('audios')) {
          const audioStore = db.createObjectStore('audios', { keyPath: ['bookId', 'pageNum'] });
          audioStore.createIndex('bookId', 'bookId', { unique: false });
        }
      };

      request.onsuccess = (event) => {
        this.db = event.target.result;
        resolve(this.db);
      };

      request.onerror = (event) => {
        reject(event.target.error);
      };
    });
  }

  async saveBook(bookData) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['books'], 'readwrite');
      const store = transaction.objectStore('books');
      const request = store.put({
        ...bookData,
        lastReadAt: Date.now()
      });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async getBook(bookId) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['books'], 'readonly');
      const store = transaction.objectStore('books');
      const request = store.get(bookId);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
  }

  async getAllBooks() {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['books'], 'readonly');
      const store = transaction.objectStore('books');
      const request = store.getAll();
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async deleteBook(bookId) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['books', 'pages', 'audios'], 'readwrite');
      const bookStore = transaction.objectStore('books');
      const pageStore = transaction.objectStore('pages');
      const audioStore = transaction.objectStore('audios');

      bookStore.delete(bookId);

      const pageIndex = pageStore.index('bookId');
      const pageReq = pageIndex.openCursor(IDBKeyRange.only(bookId));
      pageReq.onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) { cursor.delete(); cursor.continue(); }
      };

      const audioIndex = audioStore.index('bookId');
      const audioReq = audioIndex.openCursor(IDBKeyRange.only(bookId));
      audioReq.onsuccess = (event) => {
        const cursor = event.target.result;
        if (cursor) { cursor.delete(); cursor.continue(); }
      };

      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    });
  }

  async savePageContent(bookId, pageNum, text, confidence) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['pages'], 'readwrite');
      const store = transaction.objectStore('pages');
      const request = store.put({
        bookId,
        pageNum,
        text,
        confidence,
        savedAt: Date.now()
      });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async getPageContent(bookId, pageNum) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['pages'], 'readonly');
      const store = transaction.objectStore('pages');
      const request = store.get([bookId, pageNum]);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
  }

  async getBookPages(bookId) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['pages'], 'readonly');
      const store = transaction.objectStore('pages');
      const index = store.index('bookId');
      const request = index.getAll(IDBKeyRange.only(bookId));
      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });
  }

  async saveAudio(bookId, pageNum, audioBlob) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['audios'], 'readwrite');
      const store = transaction.objectStore('audios');
      const request = store.put({
        bookId,
        pageNum,
        audio: audioBlob,
        savedAt: Date.now()
      });
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async getAudio(bookId, pageNum) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(['audios'], 'readonly');
      const store = transaction.objectStore('audios');
      const request = store.get([bookId, pageNum]);
      request.onsuccess = () => resolve(request.result || null);
      request.onerror = () => reject(request.error);
    });
  }

  async isBookCached(bookId) {
    const pages = await this.getBookPages(bookId);
    if (pages.length === 0) return false;
    
    for (const page of pages) {
      const audio = await this.getAudio(bookId, page.pageNum);
      if (!audio) return false;
    }
    return true;
  }
}

        // ===== mimo TTS =====
        async function speakWithMimoTTS(text, opts = {}) {
            const apiUrl = 'https://token-plan-cn.xiaomimimo.com/v1/chat/completions';
            const apiKey = 'tp-cgdr7i0jzptpkt3vwjqr4fl4uxxndfjlz8dly1o2lx5mnord';

            const style = opts.style || SPEED_MAP[voiceSettings.readSpeed] || SPEED_MAP.normal;

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + apiKey,
                    'api-key': apiKey
                },
                body: JSON.stringify({
                    model: 'mimo-v2.5-tts',
                    messages: [
                        { role: 'user', content: style },
                        { role: 'assistant', content: text }
                    ],
                    audio: {
                        format: 'wav',
                        voice: voiceSettings.currentVoice
                    }
                })
            });

            if (!response.ok) {
                throw new Error('TTS请求失败: ' + response.status);
            }

            const result = await response.json();

            if (result.choices && result.choices.length > 0 && result.choices[0].message.audio) {
                const audioBase64 = result.choices[0].message.audio.data;
                const audioBytes = base64ToArrayBuffer(audioBase64);
                const blob = new Blob([audioBytes], { type: 'audio/wav' });

                if (opts.saveCache && opts.bookId && opts.pageNum) {
                    try {
                        await storage.saveAudio(opts.bookId, opts.pageNum, blob);
                    } catch (e) { console.log('音频缓存失败:', e); }
                }

                await playCachedAudio(blob, opts);
            } else {
                throw new Error('未获取到音频数据');
            }
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const buf = ctx.createBuffer(1, 1, 22050);
                const src = ctx.createBufferSource();
                src.buffer = buf;
                src.connect(ctx.destination);
                src.start(0);
                setTimeout(() => ctx.close(), 100);
            } catch (e) {}
        }
        document.addEventListener('touchstart', unlockAudio, { once: true });

        async function playCachedAudio(audioBlob, opts = {}) {
            return new Promise((resolve) => {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }

                const url = URL.createObjectURL(audioBlob);
                currentAudio = new Audio(url);
                currentAudio.playbackRate = opts.rate || 0.9;

                currentAudio.onended = () => {
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                    resolve();
                };
                currentAudio.onerror = (e) => {
                    console.log('[Audio] 播放错误:', e);
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                    resolve();
                };
                const p = currentAudio.play();
                if (p && p.catch) p.catch(e => { console.log('[Audio] play()被拒绝:', e); resolve(); });
            });
        }

        async function speakWithEdgeTTS(text, opts = {}) {
            return new Promise(async (resolve, reject) => {
                try {
                    if (!edgeTTS) {
                        edgeTTS = new EdgeTTS();
                        await edgeTTS.setVoice('zh-CN-XiaoxiaoNeural');
                    }

                    let done = false;
                    const timeout = setTimeout(() => {
                        if (!done) { done = true; reject(new Error('Edge TTS超时')); }
                    }, 15000);

                    edgeTTS.onAudio = async (audioData) => {
                        if (done) return;
                        done = true;
                        clearTimeout(timeout);
                        const blob = new Blob([audioData], { type: 'audio/mp3' });
                        console.log('[EdgeTTS] 收到音频, 大小:', blob.size);

                        if (opts.saveCache && opts.bookId && opts.pageNum) {
                            try {
                                await storage.saveAudio(opts.bookId, opts.pageNum, blob);
                            } catch (e) { console.log('音频缓存失败:', e); }
                        }

                        await playCachedAudio(blob, opts);
                        resolve();
                    };

                    edgeTTS.onError = (err) => {
                        if (done) return;
                        done = true;
                        clearTimeout(timeout);
                        console.log('[EdgeTTS] 错误:', err);
                        reject(new Error('Edge TTS错误'));
                    };

                    await edgeTTS.toStream(text);
                } catch (err) {
                    console.log('[EdgeTTS] 调用失败:', err);
                    reject(err);
                }
            });
        }

        async function speakWithWebSpeech(text, opts = {}) {
            return new Promise((resolve, reject) => {
                if (!('speechSynthesis' in window)) {
                    console.log('[WebSpeech] 不支持');
                    resolve(); return;
                }
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'zh-CN';
                u.rate = opts.rate || 0.85;
                u.pitch = opts.pitch || 1.2;
                u.volume = opts.volume || 1;
                if (ttsVoice) u.voice = ttsVoice;
                let resolved = false;
                const done = () => { if (!resolved) { resolved = true; resolve(); } };
                u.onstart = () => { console.log('[WebSpeech] 开始播放'); };
                u.onend = () => { console.log('[WebSpeech] 播放结束'); done(); };
                u.onerror = (e) => { console.log('[WebSpeech] 错误:', e); done(); };
                state.ttsUtterance = u;
                try {
                    speechSynthesis.speak(u);
                    console.log('[WebSpeech] speak()已调用');
                } catch (e) {
                    console.log('[WebSpeech] speak()异常:', e);
                    reject(e);
                    return;
                }
                setTimeout(done, 30000);
            });
        }

                    scanCanvas.width = video.videoWidth;

                    scanCtx.drawImage(video, 0, 0);

                    }, 'image/jpeg', 0.6);

                if (state.isDetecting) {
